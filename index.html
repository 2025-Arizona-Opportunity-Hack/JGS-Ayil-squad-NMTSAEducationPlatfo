<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />

    <title>Content Portal</title>

    <!--
      Neutral default favicon (a plain document glyph, no org branding) so
      there's no /favicon.ico 404 before siteSettings loads or for instances
      that never upload a custom favicon. src/App.tsx swaps this out for the
      configured siteSettings.faviconUrl at runtime when one is set.
    -->
    <link
      id="favicon"
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b82f6'/%3E%3Cpath d='M20 18h16a4 4 0 0 1 4 4v22l-8-6-8 6V22a4 4 0 0 1 4-4z' fill='%23ffffff'/%3E%3C/svg%3E"
    />

    <meta property="og:image" content="/og-preview.png" />

    <!-- Apply cached theme color immediately to prevent flash -->
    <script>
      (function() {
        var cached = localStorage.getItem('theme-primary-color');
        if (cached) {
          try {
            var hex = cached.replace(/^#/, '');
            var r = parseInt(hex.substring(0, 2), 16) / 255;
            var g = parseInt(hex.substring(2, 4), 16) / 255;
            var b = parseInt(hex.substring(4, 6), 16) / 255;
            var max = Math.max(r, g, b), min = Math.min(r, g, b);
            var h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
              var d = max - min;
              s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
              if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
              else if (max === g) h = ((b - r) / d + 2) / 6;
              else h = ((r - g) / d + 4) / 6;
            }
            var hsl = Math.round(h * 360) + ' ' + Math.round(s * 100) + '% ' + Math.round(l * 100) + '%';
            document.documentElement.style.setProperty('--primary', hsl);
            document.documentElement.style.setProperty('--ring', hsl);
            document.documentElement.style.setProperty('--primary-hex', cached);
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
