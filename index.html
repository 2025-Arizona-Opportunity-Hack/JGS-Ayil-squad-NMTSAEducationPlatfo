<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />

    <title>Content Portal</title>

    <meta property="og:image" content="/og-preview.png" />

    <!--
      Apply the resolved theme before first paint. This mirrors next-themes'
      own resolution logic (storage key "theme"); it must stay in sync with
      defaultTheme in src/main.tsx, or next-themes will correct the class
      after mount and the flash gets worse rather than better.
    -->
    <script id="theme-init">
      (function () {
        try {
          var stored = localStorage.getItem('theme') || 'dark';
          var resolved = stored === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : stored;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>

    <!-- Apply cached theme color immediately to prevent flash -->
    <script>
      (function() {
        var cached = localStorage.getItem('theme-primary-color');
        // Skip in dark mode: the cached value is the unadjusted light-mode
        // colour. BrandColorProvider computes the readable dark variant once
        // React mounts; until then the accessible CSS token stands.
        // Skip malformed values too — primaryColor is stored unvalidated, and
        // a bad hex here would set a NaN custom property that nothing corrects.
        if (cached && /^#?[0-9a-fA-F]{6}$/.test(cached)
            && !document.documentElement.classList.contains('dark')) {
          try {
            var hex = cached.replace(/^#/, '');
            var r = parseInt(hex.substring(0, 2), 16) / 255;
            var g = parseInt(hex.substring(2, 4), 16) / 255;
            var b = parseInt(hex.substring(4, 6), 16) / 255;
            var max = Math.max(r, g, b), min = Math.min(r, g, b);
            var h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
              var d = max - min;
              s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
              if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
              else if (max === g) h = ((b - r) / d + 2) / 6;
              else h = ((r - g) / d + 4) / 6;
            }
            var hsl = Math.round(h * 360) + ' ' + Math.round(s * 100) + '% ' + Math.round(l * 100) + '%';
            document.documentElement.style.setProperty('--primary', hsl);
            document.documentElement.style.setProperty('--ring', hsl);
            document.documentElement.style.setProperty('--primary-hex', cached);
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
